name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write   # publier l'image sur GHCR avec le jeton fourni par GitHub (aucun mot de passe à stocker)

jobs:
  verifier:
    runs-on: ubuntu-latest
    # Une vraie base pour la CI : toute la suite tourne sur Postgres, comme en production.
    services:
      postgres:
        image: pgvector/pgvector:pg16   # Postgres 16 + pgvector, comme en production
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Valeurs factices : les tests ne contactent aucun service externe (sauf la base ci-dessus).
      LLM_MODEL: openai/test
      OPENAI_API_KEY: test
      TELNYX_API_KEY: test
      PUBLIC_HOST: example.test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/intake_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/intake_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-graphe.txt pytest ruff
      - run: python -m ruff check .
      # PYSEC-2026-4240 (langgraph-sdk) : décorateurs d'autorisation du serveur LangGraph, inutilisés ici ; voir dossiers/graphe/COMPARAISON.md
      - run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-graphe.txt --ignore-vuln PYSEC-2026-4240   # dépendances connues pour une faille
      - run: python -m pytest -q

  image:
    needs: verifier
    if: github.event_name == 'push'   # on ne publie pas depuis une pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/theodorosmd/intake-py
          tags: type=sha,format=short   # ex. sha-9bfd5a4 : un contenu = une étiquette, pour toujours
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
